name: Build RCOS 3.0 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcos-3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract RCOS 3.0 project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q RCOS-3.0-Build-Ready.zip -d extracted

      - name: Build RCOS 3.0 APK
        working-directory: extracted/rcos-mobile-fixed
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Upload RCOS 3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: RCOS-3.0-Debug-APK
          path: extracted/rcos-mobile-fixed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
